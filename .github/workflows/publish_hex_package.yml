# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish consulex hex package

# Publishes to hex.pm when a commit lands on main, or when run by hand from the
# Actions tab.
#
# Guarded on the version in mix.exs not already being on hex.pm. Hex rejects a
# re-publish of an existing version, so without that check every commit that
# does not bump the version would fail the job and page whoever merged it. Most
# commits do not bump it, so the common case is a clean skip.
#
# Releasing is therefore driven by mix.exs: bump `version:` in the same PR as
# the change, and merging it publishes. Leave it alone and merging does nothing.
#
# A manual run covers what the push trigger cannot: retrying a run that failed,
# or publishing from a ref other than main. It reads the version from mix.exs on
# whichever ref you pick -- there is no version input, so that file stays the
# single source of truth either way.
on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      replace:
        description: >-
          Overwrite the version if it is already on hex.pm. Hex only permits
          this within one hour of that version's initial publish.
        type: boolean
        default: false

jobs:
  publish_to_hex:
    name: Publish consulex package to Hex
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      # Check hex.pm first so a commit that does not bump the version skips
      # cleanly instead of failing the job. A manual run can pass `replace` to
      # overwrite a version that is already up; Hex permits that only within an
      # hour of its initial publish, and the publish step forwards --replace so
      # a late attempt gets Hex's own error rather than being silently skipped.
      - name: Check whether this version is already on hex.pm
        id: check
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          VERSION="$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])' | tail -n1)"
          echo "Version in mix.exs: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://hex.pm/api/packages/consulex/releases/${VERSION}")"

          case "${STATUS}" in
            200)
              if [ "${REPLACE}" = "true" ]; then
                echo "::warning::consulex ${VERSION} is already on hex.pm; overwriting because 'replace' was set."
                echo "should_publish=true" >> "$GITHUB_OUTPUT"
              else
                echo "::notice::consulex ${VERSION} is already on hex.pm; nothing to publish."
                echo "should_publish=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "consulex ${VERSION} is not on hex.pm; it will be published."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected HTTP ${STATUS} from hex.pm; refusing to guess." >&2
              exit 1
              ;;
          esac

      # consulex is public, so the org's VAULT_HA_* secrets are not exposed to it
      # and the Vault approle route the other repos use cannot work here. The key
      # is a repo-level secret instead.
      #
      # Checked explicitly because Hex reads an empty HEX_API_KEY as no
      # credential at all, so a missing secret would otherwise surface further in
      # as an auth error rather than a missing-secret one.
      - name: Check HEX_API_KEY is present
        if: steps.check.outputs.should_publish == 'true'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HEX_API_KEY}" ]; then
            echo "::error::HEX_API_KEY is empty or not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "HEX_API_KEY is present."

      - name: Publish package to hex.pm
        id: publish
        if: steps.check.outputs.should_publish == 'true'
        run: mix hex.publish --yes ${{ inputs.replace == true && '--replace' || '' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      # Keyed on the publish step's own outcome, not on the guard's decision:
      # the guard only says whether a publish was *wanted*, so reading it here
      # claimed success for runs where a later step had failed.
      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.check.outputs.version }}
          WANTED: ${{ steps.check.outputs.should_publish }}
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          case "${OUTCOME}" in
            success)
              echo "Published consulex ${VERSION} to hex.pm." >> "$GITHUB_STEP_SUMMARY"
              ;;
            failure)
              echo "FAILED to publish consulex ${VERSION}; it is not on hex.pm." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              # The publish step never ran: either the guard skipped it, or a
              # step before it failed.
              if [ "${WANTED}" = "true" ]; then
                echo "Did NOT publish consulex ${VERSION}: a step before the publish failed." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Skipped: consulex ${VERSION} is already on hex.pm." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac
